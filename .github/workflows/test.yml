name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - if: runner.os == 'Linux'
        run: bash -n install.sh install-ubuntu.sh bin/preview bin/stage
      - if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          test_root="$RUNNER_TEMP/elliptic-stage-test"
          mkdir -p "$test_root/public"
          git -C "$test_root" init
          printf 'stage works\n' > "$test_root/public/index.html"
          (cd "$test_root" && "$GITHUB_WORKSPACE/bin/stage" --site ci-preview)
          port=$(python3 -c 'import zlib; print(20000 + zlib.crc32(b"ci-preview") % 20000)')
          curl -fsS "http://127.0.0.1:$port" | grep -Fx 'stage works'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content install-windows.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content bin/preview.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content bin/stage.ps1 -Raw)) | Out-Null
