[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elliptic-preview"
version = "0.3.0"
description = "Point one private Tailscale URL at the current Git project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliptic" }]
dependencies = []

[project.scripts]
preview = "preview_tool.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
script-files = ["bin/stage", "bin/stage.ps1"]

[tool.setuptools.packages.find]
where = ["src"]
